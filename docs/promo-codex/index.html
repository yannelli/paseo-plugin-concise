<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Be concise: Codex design pass</title><style>
    @font-face{font-family:Geist;src:url('./assets/geist.woff2')}*{box-sizing:border-box}body{margin:0;padding:40px;background:#18191d;color:#faf7f2;font-family:Geist,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:36px}h1{font-size:28px;margin:0}p{color:#b9b6b1;font-size:15px}
    button{border:1px solid #64615d;border-radius:8px;background:transparent;color:inherit;padding:12px 16px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#ff4a24;border-color:#ff4a24}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0}img{width:100%;display:block;border-radius:10px}figcaption{padding:10px 0;font-size:14px;color:#b9b6b1}
    body[data-theme=dark] .light,body[data-theme=light] .dark{display:none}@media(max-width:800px){body{padding:16px}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}
    </style></head><body data-theme="both"><header><div><h1>Be concise / Codex design pass</h1><p>1920 × 1080 · Existing Paseo captures with sample data</p></div>
    <nav aria-label="Screenshot theme"><button data-theme="both" aria-pressed="true">Compare</button> <button data-theme="dark" aria-pressed="false">Dark UI</button> <button data-theme="light" aria-pressed="false">Light UI</button></nav></header>
    <main class="grid"><figure class="dark"><a href="dark/composer.png"><img src="dark/composer.png" alt="In your composer, dark theme"></a><figcaption>In your composer · dark UI</figcaption></figure><figure class="light"><a href="light/composer.png"><img src="light/composer.png" alt="In your composer, light theme"></a><figcaption>In your composer · light UI</figcaption></figure><figure class="dark"><a href="dark/activity.png"><img src="dark/activity.png" alt="Live activity, dark theme"></a><figcaption>Live activity · dark UI</figcaption></figure><figure class="light"><a href="light/activity.png"><img src="light/activity.png" alt="Live activity, light theme"></a><figcaption>Live activity · light UI</figcaption></figure><figure class="dark"><a href="dark/configuration.png"><img src="dark/configuration.png" alt="Project settings, dark theme"></a><figcaption>Project settings · dark UI</figcaption></figure><figure class="light"><a href="light/configuration.png"><img src="light/configuration.png" alt="Project settings, light theme"></a><figcaption>Project settings · light UI</figcaption></figure><figure class="dark"><a href="dark/playground.png"><img src="dark/playground.png" alt="Rule playground, dark theme"></a><figcaption>Rule playground · dark UI</figcaption></figure><figure class="light"><a href="light/playground.png"><img src="light/playground.png" alt="Rule playground, light theme"></a><figcaption>Rule playground · light UI</figcaption></figure><figure class="dark"><a href="dark/mobile.png"><img src="dark/mobile.png" alt="On your phone, dark theme"></a><figcaption>On your phone · dark UI</figcaption></figure><figure class="light"><a href="light/mobile.png"><img src="light/mobile.png" alt="On your phone, light theme"></a><figcaption>On your phone · light UI</figcaption></figure></main>
    <script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.theme=button.dataset.theme;document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));</script></body></html>
