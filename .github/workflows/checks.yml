name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PASEO_CONCISE_ROOT: ${{ github.workspace }}/.upstream/be-concise
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yannelli/be-concise
          ref: 5fafaef38f6e8a13a93a00469ebb741aa0b66b06 # v0.7.0
          path: .upstream/be-concise
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
